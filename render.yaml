services:
  - type: web
    name: darglobal-wasalt-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # uses your existing paid plan — change to 'standard' if needed
    region: singapore      # closest to Dubai/KSA; change to 'frankfurt' if preferred
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false        # set manually in Render dashboard → Environment tab
      - key: PORT
        value: "7860"
    healthCheckPath: /api/health
    autoDeploy: true       # auto-deploys on every git push to main
