<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Black background -->
  <rect width="64" height="64" rx="10" fill="#090D16"/>
  <!-- Gold "D" letterform -->
  <text x="10" y="50" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="url(#gold)">D</text>
  <!-- Gold gradient -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#DFBF77"/>
      <stop offset="50%"  stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7733"/>
    </linearGradient>
  </defs>
  <!-- Small globe dot -->
  <circle cx="42" cy="38" r="6" fill="none" stroke="#C5A059" stroke-width="1.2"/>
  <line x1="36" y1="38" x2="48" y2="38" stroke="#C5A059" stroke-width="0.8"/>
  <line x1="42" y1="32" x2="42" y2="44" stroke="#C5A059" stroke-width="0.8"/>
  <ellipse cx="42" cy="38" rx="3.5" ry="6" fill="none" stroke="#C5A059" stroke-width="0.8"/>
</svg>
